name: Claude

# Automated review of every pull request from this repository, and answers
# when a maintainer mentions @claude. Authenticates with the maintainer's
# Claude subscription: CLAUDE_CODE_OAUTH_TOKEN comes from `claude setup-token`.
#
# Fork pull requests: `pull_request` runs get no secrets, so their automatic
# review is skipped. A maintainer reviews one by mentioning @claude in the PR
# conversation; `issue_comment` runs the workflow from the default branch, with
# the secret, and only for comments by the repository's own people.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  review:
    name: review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1.0.267
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request of quickpdf.nvim, a Neovim plugin that
            shows PDFs in a Quickshell window placed by the compositor.
            Read GLOSSARY.md, docs/architecture.md and docs/adr/ first, and
            hold the change to them.

            Report, most severe first:
            1. Bugs and behaviour that contradicts the linked issue or an ADR.
            2. Security problems, in particular external programs started
               through a shell or with unescaped arguments.
            3. Behaviour changes without a test (tests are written first and
               run against fake executables, docs/adr/0004).
            4. Docs, GLOSSARY.md terms or ADRs the change leaves outdated.

            Put each finding as an inline comment on the line it concerns.
            End with one short PR comment summarising the findings, or saying
            there are none. Do not approve or request changes.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    name: mention
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1.0.267
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: false
