name: Lint

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stylua:
    name: stylua
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: JohnnyMorganz/stylua-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check lua

  selene:
    name: selene
    runs-on: ubuntu-24.04
    env:
      SELENE_VERSION: "0.32.0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install selene
        run: |
          curl -fsSL -o selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          unzip -q selene.zip -d "$RUNNER_TEMP/selene"
          chmod +x "$RUNNER_TEMP/selene/selene"
          echo "$RUNNER_TEMP/selene" >> "$GITHUB_PATH"
      - run: selene lua

  lua-language-server:
    name: lua-language-server
    runs-on: ubuntu-24.04
    env:
      LUALS_VERSION: "3.19.2"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: stable
      - name: Install lua-language-server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -fsSL \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - name: Type check
        run: |
          VIMRUNTIME="$(nvim --clean --headless --cmd 'lua io.write(vim.env.VIMRUNTIME)' +q)"
          export VIMRUNTIME
          lua-language-server --check="$PWD/lua" --checklevel=Warning \
            --configpath="$PWD/.luarc.json" --logpath="$RUNNER_TEMP/luals-log" | tee luals.out
          grep -q "no problems found" luals.out

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          globs: "**/*.md"

  qmllint:
    name: qmllint (warning only)
    runs-on: ubuntu-24.04
    # qmllint does not know Quickshell's QML modules, so its findings are
    # reported but do not fail the build (see issue #3).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install qmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools
      - run: /usr/lib/qt6/bin/qmllint quickshell/pdf_viewer/shell.qml
